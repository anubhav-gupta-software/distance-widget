# Open DistanceWidget.xcodeproj, which is generated from this file.
# To regenerate after a project change: brew install xcodegen && xcodegen generate
name: DistanceWidget
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  defaultConfig: Release
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1"
  CODE_SIGN_STYLE: Automatic
  SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  DistanceCore:
    path: DistanceCore
targets:
  DistanceWidget:
    type: application
    platform: iOS
    sources:
      - path: DistanceWidget
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: DistanceCore
      - target: DistanceWidgetExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        PRODUCT_NAME: DistanceWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DistanceWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DistanceWidget/DistanceWidget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_STYLE: Automatic
  DistanceWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DistanceWidgetExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: DistanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).widget"
        PRODUCT_NAME: DistanceWidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DistanceWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: DistanceWidgetExtension/DistanceWidgetExtension.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        CODE_SIGN_STYLE: Automatic
schemes:
  DistanceWidget:
    build:
      targets:
        DistanceWidget: all
        DistanceWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
